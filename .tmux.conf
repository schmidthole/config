set -g status on
set -g status-position top

# status bar styling
set -g status-style bg=default,fg=colour245
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-current-style bg=colour238,fg=colour255,bold
set -g status-left ""
set -g status-right "#{?window_zoomed_flag, [Z] ,} #S "

# padding between status bar and panes
set -g status 2
set -g status-format[1] ''
set -g mouse on
set -g escape-time 0
set -g history-limit 50000
set -g renumber-windows on
set -g set-clipboard on
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour245

# pane navigation (alt + vim keys)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# pane creation (alt + split direction)
bind -n M-\\ split-window -h -c "#{pane_current_path}"
bind -n M-- split-window -v -c "#{pane_current_path}"

# pane destruction
bind -n M-q kill-pane

# pane resizing (alt + shift + vim keys)
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# window/workspace management (alt + number to switch, alt+c to create, alt+x to kill)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-[ previous-window
bind -n M-] next-window
bind -n M-c new-window -c "#{pane_current_path}"
bind -n M-x kill-window

# window numbering starts at 1
set -g base-index 1
set -g pane-base-index 1

# swap panes (alt + shift + arrows)
bind -n M-S-Left swap-pane -U
bind -n M-S-Right swap-pane -D

# copy mode (vim keys)
bind -n M-v copy-mode \; set -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

bind -n M-m resize-pane -Z
bind -n M-s choose-session
bind -n M-n command-prompt -I "#W" "rename-window '%%'"
bind -n M-N command-prompt -I "#S" "rename-session '%%'"
bind -n M-C command-prompt "new-session -s '%%'"
bind -n M-d detach
